<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>实时字幕 · AI 助教</title><link rel="stylesheet" href="./assets/subtitles/reading-20261014-v1.css"><script type="module" src="./assets/subtitles/reading-20261014-v1.js"></script></head>
<body><main>
  <h1 class="sr-only">中日实时字幕</h1>
  <section class="controls" aria-label="字幕控制">
    <div class="toolbar">
      <label class="direction"><span class="sr-only">翻译方向</span><select id="direction"><option value="ja-zh">日语 → 中文</option><option value="zh-ja">中文 → 日语</option></select></label>
      <button id="start" class="primary" aria-pressed="false" disabled>开始收音</button>
    </div>
    <div class="control-meta">
      <label class="save"><input id="save" type="checkbox" checked>保存录音</label>
      <div class="statusbar"><span id="status" role="status" aria-live="polite">正在检查服务…</span><span id="duration">00:00</span><meter id="level" min="0" max="1" value="0" aria-label="麦克风音量"></meter></div>
    </div>
    <p id="notice" class="notice" role="status" aria-live="polite">请保持页面在前台，录音前请告知参与者。</p>
  </section>
  <section class="captions" aria-label="实时字幕">
    <div class="source-column"><h2 id="source-title">日语原文</h2><p id="live-source" class="empty" lang="ja">讲话后，原文会显示在这里。</p></div>
    <div class="target-column">
      <div class="caption-heading"><h2 id="target-title">中文字幕</h2><button id="text-size" class="quiet" aria-pressed="false" aria-controls="live-target">大字</button></div>
      <p id="previous-target" hidden></p>
      <p id="live-target" class="empty" lang="zh-CN" aria-live="polite" aria-atomic="true">译文会随讲话逐步出现。</p>
      <div class="caption-meta"><span id="caption-state">等待收音</span><span>当前一句</span></div>
    </div>
    <div class="caption-footer">
      <details class="recordings">
        <summary>记录与导出<span>字幕 · 录音</span></summary>
        <div class="recording-content">
          <section class="transcript-history" aria-label="本次完整字幕">
            <div class="section-heading"><h2>本次字幕</h2><button id="export" disabled>导出字幕</button></div>
            <div class="history-columns"><div><h3>原文</h3><div id="source"><p class="empty">暂无字幕。</p></div></div><div><h3>译文</h3><div id="target"><p class="empty">暂无字幕。</p></div></div></div>
          </section>
          <div class="section-heading"><h2>我的录音</h2><button id="refresh">刷新</button></div><p id="recording-help" class="small">录音仅自己可见，分段保存。这里显示最近 50 场。</p><div id="recordings">正在读取录音…</div>
          <a id="back" href="./?ta=1">返回 AI 助教</a>
        </div>
      </details>
    </div>
  </section>
</main></body></html>
