name: Inspect live learning asset
on:
  pull_request:
    paths:
      - .github/workflows/inspect-learning.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.OMINDOS_SSH_KEY_B64 }}
        run: |
          test -n "$SSH_KEY_B64"
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/omindos
          chmod 600 ~/.ssh/omindos
          ssh-keyscan -H 39.108.50.65 >> ~/.ssh/known_hosts
      - name: Identify active release
        run: |
          ssh -i ~/.ssh/omindos -o IdentitiesOnly=yes admin@39.108.50.65 \
            "sudo find /opt/omindos-deploy -maxdepth 3 -type l -print -exec readlink -f {} \\; ; sudo sha256sum /opt/omindos-deploy/releases/chat-learning-*/chat-cloudflare/public/learning/app.js"
