name: Remove old learning login redirect
on:
  pull_request:
    paths:
      - .github/workflows/cleanup-learning-login.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.OMINDOS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_B64"
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/omindos
          chmod 600 ~/.ssh/omindos
          ssh-keyscan -H 39.108.50.65 >> ~/.ssh/known_hosts
      - name: Patch verified active files
        run: |
          set -euo pipefail
          remote=/opt/omindos-deploy/chat-current/chat-cloudflare/public/learning
          mkdir /tmp/learning-clean
          scp -i ~/.ssh/omindos -o IdentitiesOnly=yes "admin@39.108.50.65:$remote/app.js" /tmp/learning-clean/app.js
          scp -i ~/.ssh/omindos -o IdentitiesOnly=yes "admin@39.108.50.65:$remote/index.html" /tmp/learning-clean/index.html
          printf '%s  %s\n' 54503cadf48a0c7cc731e04d2f5be6fac5ae7f21838d06d110b6b2a35e692714 /tmp/learning-clean/app.js | sha256sum -c -
          printf '%s  %s\n' eb586c75f3d6fc7e50416fe2d11ec42b5be56dd0ac7a699f55e3ecef919da2d5 /tmp/learning-clean/index.html | sha256sum -c -
          node ops/cleanup-learning-login.mjs /tmp/learning-clean
          node --check /tmp/learning-clean/app.js
          sha256sum /tmp/learning-clean/app.js | cut -d ' ' -f1 > /tmp/clean-js-sha
          sha256sum /tmp/learning-clean/index.html | cut -d ' ' -f1 > /tmp/clean-html-sha
      - name: Deploy with rollback copies
        run: |
          set -euo pipefail
          scp -i ~/.ssh/omindos -o IdentitiesOnly=yes /tmp/learning-clean/app.js admin@39.108.50.65:/tmp/learning-clean-app.js
          scp -i ~/.ssh/omindos -o IdentitiesOnly=yes /tmp/learning-clean/index.html admin@39.108.50.65:/tmp/learning-clean-index.html
          js_sha=$(cat /tmp/clean-js-sha)
          html_sha=$(cat /tmp/clean-html-sha)
          ssh -i ~/.ssh/omindos -o IdentitiesOnly=yes admin@39.108.50.65 \
            "sudo bash -s -- '$js_sha' '$html_sha'" <<'REMOTE'
          set -euo pipefail
          js_sha="$1"
          html_sha="$2"
          root=/opt/omindos-deploy/chat-current/chat-cloudflare/public/learning
          test "$(readlink -f /opt/omindos-deploy/chat-current)" = /opt/omindos-deploy/releases/chat-learning-20260929T133715Z
          test "$(sha256sum "$root/app.js" | cut -d ' ' -f1)" = 54503cadf48a0c7cc731e04d2f5be6fac5ae7f21838d06d110b6b2a35e692714
          test "$(sha256sum "$root/index.html" | cut -d ' ' -f1)" = eb586c75f3d6fc7e50416fe2d11ec42b5be56dd0ac7a699f55e3ecef919da2d5
          test "$(sha256sum /tmp/learning-clean-app.js | cut -d ' ' -f1)" = "$js_sha"
          test "$(sha256sum /tmp/learning-clean-index.html | cut -d ' ' -f1)" = "$html_sha"
          cp -a "$root/app.js" "$root/app.js.bak-remove-old-login"
          cp -a "$root/index.html" "$root/index.html.bak-remove-old-login"
          cp /tmp/learning-clean-app.js "$root/app.js"
          cp /tmp/learning-clean-index.html "$root/index.html"
          test "$(sha256sum "$root/app.js" | cut -d ' ' -f1)" = "$js_sha"
          test "$(sha256sum "$root/index.html" | cut -d ' ' -f1)" = "$html_sha"
          REMOTE
