name: Apply learning entry hotfix
on:
  pull_request:
    paths:
      - .github/workflows/apply-learning-entry.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.OMINDOS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_B64"
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/omindos
          chmod 600 ~/.ssh/omindos
          ssh-keyscan -H 39.108.50.65 >> ~/.ssh/known_hosts
      - name: Verify exact live asset and prepare patch
        run: |
          set -euo pipefail
          target=/opt/omindos-deploy/chat-current/chat-cloudflare/public/learning/app.js
          scp -i ~/.ssh/omindos -o IdentitiesOnly=yes "admin@39.108.50.65:$target" /tmp/learning-entry-app.js
          printf '%s  %s\n' '2763fef70c96bdc5a98a6bb2c48f7fa403bc503d5fa0a2a07542b230bca68098' /tmp/learning-entry-app.js | sha256sum -c -
          node ops/update-learning-entry.mjs /tmp/learning-entry-app.js
          node --check /tmp/learning-entry-app.js
          sha256sum /tmp/learning-entry-app.js | cut -d ' ' -f1 > /tmp/learning-entry-new-sha
      - name: Apply only current release asset, preserving rollback copy
        run: |
          set -euo pipefail
          scp -i ~/.ssh/omindos -o IdentitiesOnly=yes /tmp/learning-entry-app.js admin@39.108.50.65:/tmp/learning-entry-patched.js
          new_sha=$(cat /tmp/learning-entry-new-sha)
          ssh -i ~/.ssh/omindos -o IdentitiesOnly=yes admin@39.108.50.65 \
            "sudo bash -s -- '$new_sha'" <<'REMOTE'
          set -euo pipefail
          new_sha="$1"
          target=/opt/omindos-deploy/chat-current/chat-cloudflare/public/learning/app.js
          staged=/tmp/learning-entry-patched.js
          test "$(readlink -f /opt/omindos-deploy/chat-current)" = /opt/omindos-deploy/releases/chat-learning-20260929T133715Z
          test "$(sha256sum "$target" | cut -d ' ' -f1)" = 2763fef70c96bdc5a98a6bb2c48f7fa403bc503d5fa0a2a07542b230bca68098
          test "$(sha256sum "$staged" | cut -d ' ' -f1)" = "$new_sha"
          cp -a "$target" "$target.bak-20260930-entry"
          cp -- "$staged" "$target"
          test "$(sha256sum "$target" | cut -d ' ' -f1)" = "$new_sha"
          REMOTE
      - name: Verify live learning file
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsS --max-time 15 https://chat.omindos.cn/learning/app.js -o /tmp/learning-entry-live.js; then break; fi
            sleep 2
          done
          cmp /tmp/learning-entry-app.js /tmp/learning-entry-live.js
